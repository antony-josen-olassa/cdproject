
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loop Statement Compiler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #111827;
            color: white;
        }
        textarea {
            width: 100%;
            height: 260px;
            box-sizing: border-box;
            padding: 14px;
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
        }
        button {
            margin: 12px 0;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #1f2937;
            padding: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Loop Statement Compiler</h1>
    <p>Enter your C code below.</p>

    <textarea id="code">int sum = 0;

for (int i = 0; i < 5; i++) {
    sum += i;
}</textarea>

    <br>
    <button id="compile">Compile Code</button>

    <h2>Diagnostics</h2>
    <pre id="diagnostics">Ready to compile.</pre>

    <h2>Three-Address Code</h2>
    <pre id="tac">No output yet.</pre>

    <script>
        document.getElementById("compile").addEventListener("click", async () => {
            const diagnostics = document.getElementById("diagnostics");
            const tac = document.getElementById("tac");

            diagnostics.textContent = "Compiling...";
            tac.textContent = "";

            try {
                const response = await fetch("/compile", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        code: document.getElementById("code").value
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Compilation failed");
                }

                diagnostics.textContent =
                    `Errors: ${result.errors}\nWarnings: ${result.warnings}\n\n` +
                    (result.diagnostics.map(d =>
                        `${d.line}:${d.column} [${d.level}] ${d.message}`
                    ).join("\n") || "No diagnostics.");

                tac.textContent = Array.isArray(result.tac)
                    ? result.tac.join("\n")
                    : String(result.tac ?? "");
            } catch (error) {
                diagnostics.textContent = error.message;
            }
        });
    </script>
</body>
</html>
